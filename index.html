<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>وهج MM | معرض السيارات</title>
    <!-- animate css link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <!-- css link -->
    <link rel="stylesheet" href="style.css" />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- header -->
    <header class="header animate__animated animate__fadeInDown">
      <div class="container">
        <div class="brand">
          <div class="logo">
            <img
              src="./images/logo.png"
              class="rotate"
              alt="t=The store logo"
            />
            <a href="#home" class="logo-type">وهج <b class="mm">MM</b></a>
          </div>
          <p class="slogan">وهج الفخامة في كل رحلة</p>
        </div>
        <nav class="navigation">
          <ul>
            <li><a href="#home">الرئيسية</a></li>
            <li><a href="#models">الموديلات</a></li>
            <li><a href="#gallery">المعرض</a></li>
            <li><a href="#contact">تواصل معنا</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <!-- hero section -->
      <section class="hero-sec" id="home">
        <div class="container">
          <div class="hero-box">
            <video
              src="./videos/video-hero.mp4"
              class="hero-video animate__animated animate__fadeIn"
              autoplay
              muted
              loop
              playsinline
            ></video>
            <div class="hero-content">
              <h1 class="hero-title animate__animated animate__fadeInUp">
                راحة وفخامة في كل رحلة
              </h1>
              <p
                class="hero-sub animate__animated animate__fadeInUp animate__delay-1s"
              >
                اختار مرسيدس اللي تناسبك، واحنا معاك لحد ما تستلمها
              </p>
              <a
                href="#models"
                class="hero-btn animate__animated animate__fadeInUp animate__delay-2s"
                >شوف الموديلات</a
              >
            </div>
          </div>
        </div>
      </section>

      <!-- cards gallery -->
      <section id="models" class="models-sec">
        <div class="container">
          <h2>الموديلات</h2>

          <div class="cards">
            <figure class="box-car">
              <img src="./images/img1.png" alt="مرسيدس G-Class AMG G 63" />
              <figcaption>
                <h3>مرسيدس G-Class</h3>
                <p>AMG G 63</p>
                <a href="#contact" class="car-btn">احجز الآن</a>
              </figcaption>
            </figure>

            <figure class="box-car">
              <img src="./images/img2.png" alt="مرسيدس G-Class AMG G 63" />
              <figcaption>
                <h3>مرسيدس G-Class</h3>
                <p>AMG G 63</p>
                <a href="#contact" class="car-btn">احجز الآن</a>
              </figcaption>
            </figure>

            <figure class="box-car">
              <img
                src="./images/img3.png"
                alt="مرسيدس G-Class AMG G 63 باللون الوردي"
              />
              <figcaption>
                <h3>مرسيدس G-Class</h3>
                <p>AMG G 63 باللون الوردي</p>
                <a href="#contact" class="car-btn">احجز الآن</a>
              </figcaption>
            </figure>

            <figure class="box-car">
              <img
                src="./images/img4.png"
                class="scale"
                alt="مرسيدس G-Class باللون الأخضر الغامق"
              />
              <figcaption>
                <h3>مرسيدس G-Class</h3>
                <p>باللون الأخضر الغامق</p>
                <a href="#contact" class="car-btn">احجز الآن</a>
              </figcaption>
            </figure>

            <figure class="box-car">
              <img src="./images/img6.png" alt="مرسيدس AMG GT 4-Door Coupe" />
              <figcaption>
                <h3>مرسيدس AMG GT</h3>
                <p>4-Door Coupe</p>
                <a href="#contact" class="car-btn">احجز الآن</a>
              </figcaption>
            </figure>

            <figure class="box-car">
              <img
                src="./images/img7.png"
                class="scale"
                alt="مرسيدس G-Class AMG G 63 بكيت تعديل"
              />
              <figcaption>
                <h3>مرسيدس G-Class</h3>
                <p>AMG G 63</p>
                <a href="#contact" class="car-btn">احجز الآن</a>
              </figcaption>
            </figure>
          </div>
        </div>
      </section>
      <!-- gallery image -->
      <section class="header-sec" id="gallery">
        <div class="container">
          <div class="header-img">
            <img src="./images/header1.jpeg" alt="mercedes G-Class image" />
          </div>
        </div>
      </section>

      <!-- featured cars -->
      <section class="featured-sec" id="featured">
        <div class="container">
          <h2>الأكثر طلبًا</h2>

          <div class="cards slide-cards">
            <figure class="box-car slide-card">
              <img src="./images/img11.png" alt="مرسيدس AMG GT 4-Door Coupe" />
            </figure>

            <figure class="box-car slide-card">
              <img src="./images/img12.png" alt="مرسيدس G-Class AMG G 63" />
            </figure>

            <figure class="box-car slide-card">
              <img
                src="./images/img13.png"
                alt="مرسيدس G-Class AMG G 63 باللون الوردي"
              />
            </figure>

            <figure class="box-car slide-card">
              <img src="./images/img14.png" alt="مرسيدس G-Class AMG G 63" />
            </figure>
          </div>
        </div>
      </section>
    </main>

    <!-- footer part -->
    <footer class="footer" id="contact">
      <div class="container">
        <span class="t-ar">© 2026 وهج MM. جميع الحقوق محفوظة.</span>
        <span class="t-en">© 2026 Wahaj MM. All rights reserved.</span>
      </div>
    </footer>
  </body>
</html>
